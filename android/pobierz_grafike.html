<!DOCTYPE html>
<html>
<head>
    <title>Download Feature Graphic</title>
</head>
<body>
    <h2>Pobieranie grafiki głównej 1024x500 jako PNG...</h2>
    <p>Jeśli pobieranie nie zacznie się automatycznie, kliknij na obrazek prawym przyciskiem i wybierz "Zapisz obraz jako".</p>
    
    <canvas id="canvas" width="1024" height="500" style="max-width: 100%; border: 1px solid #ccc;"></canvas>
    
    <script>
        const svg = `<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
    <!-- Tło -->
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0D47A1" />
            <stop offset="50%" stop-color="#1565C0" />
            <stop offset="100%" stop-color="#00BCD4" />
        </linearGradient>
    </defs>
    <rect width="1024" height="500" fill="url(#bg)" />

    <!-- Abstrakcyjne kształty w tle -->
    <circle cx="850" cy="250" r="350" fill="#FFFFFF" opacity="0.05" />
    <circle cx="950" cy="150" r="150" fill="#FFFFFF" opacity="0.1" />
    <path d="M0,450 Q250,300 500,500 L0,500 Z" fill="#FFFFFF" opacity="0.1" />
    <path d="M1024,0 Q800,150 1024,300 Z" fill="#FFFFFF" opacity="0.05" />

    <!-- Logo P (mniejsze) -->
    <g transform="translate(180, 190) scale(1.5)">
        <path fill="#FFFFFF" d="M12,6h40c3.3,0 6,2.7 6,6v40c0,3.3 -2.7,6 -6,6H12c-3.3,0 -6,-2.7 -6,-6V12c0,-3.3 2.7,-6 6,-6z" opacity="0.2"/>
        <path fill="#00BCD4" d="M44,6h8c3.3,0 6,2.7 6,6v14H44V6z" />
        <path fill="#FFFFFF" d="M21,17h7v30h-7zM28,17h10.5c6.9,0 12.5,5.6 12.5,12.5S45.4,42 38.5,42H28V17zM34,23v18h4.5c3.6,0 6.5,-2.9 6.5,-6.5S42.1,28 38.5,28H34z" />
    </g>

    <!-- Tekst -->
    <text x="350" y="260" font-family="Arial, sans-serif" font-weight="bold" font-size="72" fill="#FFFFFF">PRZevolut</text>
    <text x="355" y="310" font-family="Arial, sans-serif" font-size="28" fill="#E0F7FA">Twoje inteligentne centrum walutowe</text>
</svg>`;

        const blob = new Blob([svg], {type: 'image/svg+xml;charset=utf-8'});
        const URL = window.URL || window.webkitURL || window;
        const blobURL = URL.createObjectURL(blob);

        const image = new Image();
        image.onload = () => {
            const canvas = document.getElementById('canvas');
            const context = canvas.getContext('2d');
            context.drawImage(image, 0, 0, 1024, 500);
            URL.revokeObjectURL(blobURL);
            
            // Automatyczne pobieranie
            const a = document.createElement('a');
            a.download = 'przevolut_feature_graphic.png';
            a.href = canvas.toDataURL('image/png');
            a.click();
        };
        image.src = blobURL;
    </script>
</body>
</html>
